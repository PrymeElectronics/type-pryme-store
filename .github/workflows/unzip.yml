name: Unzip store
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the store files
        run: |
          if [ ! -f pryme-store.zip ]; then echo "No zip to unzip"; exit 0; fi
          unzip -o pryme-store.zip -d /tmp/store
          cp -r /tmp/store/pryme-store/. .
          rm pryme-store.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unzip store files"
          git push
